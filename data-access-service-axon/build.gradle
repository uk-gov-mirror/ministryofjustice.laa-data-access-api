plugins {
    id 'java'
    id 'checkstyle'
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin'
}

sourceSets {
    testUtilities {
        java.srcDir 'src/testUtilities/java'
        resources.srcDir 'src/testUtilities/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.testUtilities.output
        runtimeClasspath += sourceSets.testUtilities.output
    }
    integrationTest {
        compileClasspath += sourceSets.testUtilities.output
        runtimeClasspath += sourceSets.testUtilities.output
    }
}

configurations {
    testUtilitiesImplementation.extendsFrom testImplementation
    testUtilitiesRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation(project(':data-access-api')) {
        transitive = false
    }

    implementation 'io.projectreactor:reactor-core'
    implementation 'org.axonframework.extensions.spring:axon-spring-boot-starter:5.3.0'
    implementation 'com.networknt:json-schema-validator:3.0.6'
    implementation 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.53'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation('org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0') {
        exclude group: 'tools.jackson.core'
    }
    implementation 'org.flywaydb:flyway-database-postgresql'
    // Match the Cloud Platform IRSA/default-credentials pattern.
    implementation platform('io.awspring.cloud:spring-cloud-aws:4.1.0')
    implementation 'io.awspring.cloud:spring-cloud-aws-starter'
    implementation 'software.amazon.awssdk:sns'
    implementation 'software.amazon.awssdk:sts:2.51.4'
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient'
    testImplementation 'org.axonframework:axon-test:5.3.0'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-restclient'
    integrationTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
    integrationTestImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
    integrationTestImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
    integrationTestImplementation 'software.amazon.awssdk:sqs'
}

test {
    useJUnitPlatform()
}

tasks.named('integrationTest') {
    dependsOn tasks.named('testUtilitiesClasses')
    useJUnitPlatform()
}
