server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: data-access-service-axon
  autoconfigure:
    exclude: org.axonframework.springboot.autoconfig.XStreamAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:laa_data_access_api}?currentSchema=${AXON_DB_SCHEMA:axon}}
    username: ${DB_USERNAME:laa_user}
    password: ${DB_PASSWORD:laa_password}
  jpa:
    database-platform: uk.gov.justice.laa.dstew.access.config.ByteaEnforcedPostgresSqlDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${AXON_DB_SCHEMA:axon}
  sql:
    init:
      mode: never # Use Flyway for DB schema.
  cloud:
    aws:
      region:
        static: ${AWS_REGION:eu-west-2}
      endpoint: ${AWS_ENDPOINT_URL:}
  security:
    oauth2:
      client:
        registration:
          moj-identity:
            client-id: ${AUTH_CLIENT_ID}
            client-secret: ${AUTH_CLIENT_SECRET}
            scope: ${AUTH_SCOPE}
            authorization-grant-type: client_credentials
        provider:
          moj-identity:
            token-uri: https://login.microsoftonline.com/${AUTH_TENANT_ID}/oauth2/v2.0/token
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI}
          jwk-set-uri: ${ENTRA_JWK_SET_URI}
          audience: ${ENTRA_AUD}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:10MB}

axon:
  axonserver:
    enabled: false
  converter:
    general: jackson
    events: jackson
    messages: jackson
  db:
    # Schema and Flyway history table are env-overridable so Helm-injected values
    # (e.g. data_access_axon / flyway_schema_history_axon) take effect at runtime.
    schema: ${AXON_DB_SCHEMA:axon}
    flyway-table: ${AXON_FLYWAY_TABLE:flyway_schema_history}

application:
  projection:
    timeout: 5s
  assessment:
    reconciliation:
      threshold: ${ASSESSMENT_RECONCILIATION_THRESHOLD:15m}
      interval: ${ASSESSMENT_RECONCILIATION_INTERVAL:5m}

laa:
  springboot:
    starter:
      oauth2:
        scopes-claim-path: scp
        resourceserver:
          jwt:
            tenants:
              - issuer-uri: ${ENTRA_ISSUER_URI}
                audiences:
                  - ${ENTRA_AUD}
        authorized-roles: '[
          {
            "name": "LAA_CASEWORKER", 
            "uris": [
              {
                "method": ["POST", "PUT", "PATCH", "DELETE"],
                "uri": "/api/**"
              },
              {
                "method": ["GET"],
                "uri": "/api/v*/work-list"
              },
              {
                "method": ["GET"],
                "uri": "/api/v*/individuals"
              },
              {
                "method": ["GET"],
                "uri": "/api/v*/prior-authorities/**"
              },
              {
                "method": ["GET"],
                "uri": "/api/v*/sds/health"
              }
            ]
          },
          {
            "name": "LAA_DECIDE_AUTO_GRANT", 
             "uris": [
              {
                "method": ["GET"],
                "uri": "/api/v*/applications/*"
              },
              {
                "method": ["PATCH"],
                "uri": "/api/v*/applications/*/auto-grant-outcome"
              }
            ]
          }
        ]'
        authorized-scopes: '[
          {
            "name": "access_as_user",
            "uris": ["/api/**"]
          },
          {
            "name": "access_as_provider",
            "uris": ["/api/**"]
          }
        ]'
        unprotected-uris:
          - /error
          - /actuator/health
          - /actuator/health/**
          - /actuator/info
          - /actuator/prometheus
          - /actuator/metrics/**
          - /swagger-ui/**
          - /v3/api-docs/**

logging:
  level:
    root: ${ROOT_LOGGING_LEVEL:INFO}
    org.springframework: ${SPRING_LOGGING_LEVEL:INFO}
    org.springframework.web: ${SPRING_LOGGING_LEVEL:INFO}
    org.springframework.security: INFO
    org.hibernate: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
    com.azure.spring: INFO
    uk.gov.justice.laa.dstew.access: ${APP_LOGGING_LEVEL:INFO}
    uk.gov.justice.laa.dstew.access.config.SecurityConfig: WARN
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: WARN
    org.springframework.boot.actuate: WARN
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: laa-data-access-api
        version: ${info.app.version:unknown}
        environment: ${sentry.environment:local}
        node_name: ${HOSTNAME:unknown}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint.health.show-details: always
  info.env.enabled: true
  metrics:
    tags:
      release: ${METRICS_RELEASE_TAG:local}
    distribution:
      percentile-histogram:
        jdbc.query: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    baggage:
      enabled: true
      remote-fields: X-Correlation-ID
      correlation:
        enabled: true
        fields: correlationId
  observations:
    http:
      server:
        requests:
          name: http.server.requests
      client:
        requests:
          name: http.client.requests

springdoc:
  api-docs:
    version: openapi_3_1

sentry:
  enabled: ${SENTRY_ENABLED:false}
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:1}
  send-default-pii: false
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

feature:
  enable-dev-token: ${FEATURE_ENABLE_DEV_TOKEN:false}
  disable-security: ${FEATURE_DISABLE_SECURITY:false}

app:
  sds-api:
    url: ${SDS_API_URL}
    bucket-name: ${SDS_API_BUCKET}
    client-registration-id: ${SDS_API_CLIENT_REGISTRATION_ID:moj-identity}
    principal-name: ${SDS_API_PRINCIPAL_NAME}
    oauth2:
      client-id: ${AUTH_CLIENT_ID}
      client-secret: ${AUTH_CLIENT_SECRET}
      scope: ${AUTH_SCOPE}
      token-uri: https://login.microsoftonline.com/${AUTH_TENANT_ID}/oauth2/v2.0/token
