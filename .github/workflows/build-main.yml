name: Build and deploy main

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        required: true
        default: "patch"
        description: "Release type"
        options: [ "patch", "minor", "major" ]

permissions:
  contents: read

env:
  JAVA_VERSION: &JAVA_VERSION '25'
  JDK_DISTRIBUTION: &JDK_DISTRIBUTION 'corretto'

jobs:
  release:
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/gradle-build-and-publish.yml@035ee98ca0047659f865532ea6234abd69529ee8 # v2.5.0
    permissions:
      contents: write
      packages: write
    with:
      java_distribution: *JDK_DISTRIBUTION
      integration_test_task: "integrationTest"
      release_type: ${{ inputs.release_type || '' }}
      jacoco_coverage_report: 'false'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  # Verify every consumer contract against this main version and publish the results, so the
  # version recorded as deployed to environment `main` (below) carries verification results.
  # Not a deploy dependency: a failure is visible here but does not block the release.
  pact-test:
    needs: [ release ]
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/pact-and-publish.yml@035ee98ca0047659f865532ea6234abd69529ee8 # v2.5.0
    permissions:
      contents: write
      packages: write
    with:
      java_distribution: *JDK_DISTRIBUTION
      pact_test_task: ":data-access-service-axon:pactTest"
      pacticipant_name: 'laa-data-access-api'
      is_provider: true
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      pact_broker_url: ${{ secrets.PACT_BROKER_URL }}
      pact_broker_username: ${{ secrets.PACT_BROKER_USERNAME }}
      pact_broker_password: ${{ secrets.PACT_BROKER_PASSWORD }}

  smoke-tests:
    needs: [ release, ecr-publish-service-image, vulnerability-scan-app ]
    if: ${{ needs.release.outputs.published_artifact_version != '' }}
    uses: ./.github/workflows/smoke-tests.yml
    with:
      image-tag: ${{ needs.ecr-publish-service-image.outputs.published_image_version }}
    secrets:
      KUBE_CERT: ${{ secrets.KUBE_CERT }}
      KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
      KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
      KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
      ECR_ROLE_TO_ASSUME: ${{ secrets.ECR_ROLE_TO_ASSUME }}
    permissions:
      contents: read
      id-token: write

  vulnerability-scan-app:
    runs-on: ubuntu-latest
    needs: [ release ]
    permissions:
      contents: read
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_TEST_EXCLUDE: build,generated
      SNYK_TARGET_REFERENCE: main
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Snyk to check app for vulnerabilities
        uses: snyk/actions/gradle@9adf32b1121593767fc3c057af55b55db032dc04 #master
        with:
          command: code test
          args: --severity-threshold=high

  ecr-publish-service-image:
    needs: [ release ]
    if: ${{ needs.release.outputs.published_artifact_version != '' }}
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/ecr-publish-image.yml@035ee98ca0047659f865532ea6234abd69529ee8 # v2.5.0
    permissions:
      contents: read
      id-token: write
      security-events: write
    with:
      java_distribution: *JDK_DISTRIBUTION
      dockerfile_path: Dockerfile.axon
      image_version: ${{ needs.release.outputs.published_artifact_version }}
      image_scan: 'false'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      ecr_repository: ${{ vars.ECR_REPOSITORY }}
      ecr_region: ${{ vars.ECR_REGION }}
      ecr_role_to_assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}

  deploy-uat:
    runs-on: ubuntu-latest
    needs: [ release, ecr-publish-service-image, smoke-tests, vulnerability-scan-app ]
    environment: uat
    permissions:
      id-token: write
      contents: read
    outputs:
      release-name: ${{ steps.deploy_uat_branch.outputs.release-name }}
      branch-name: ${{ steps.deploy_uat_branch.outputs.branch-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy UAT
        id: deploy_uat_branch
        uses: ./.github/actions/deploy_branch
        with:
          ecr-region: ${{ vars.ECR_REGION }}
          ecr-role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          ecr-repository: ${{ vars.ECR_REPOSITORY }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          app-environment: uat
          image-tag: ${{ needs.ecr-publish-service-image.outputs.published_image_version }}
      # Consumers run `can-i-deploy --to-environment main` against this provider. Environment
      # `main` is the LAA convention for the main-branch (UAT) deployment, so record it here.
      - name: Record UAT deployment to pact broker
        id: record_uat_deployment
        uses: ministryofjustice/laa-ccms-common-workflows/.github/actions/pact-record-deployment@035ee98ca0047659f865532ea6234abd69529ee8 # v2.5.0
        with:
          pacticipant: 'laa-data-access-api'
          environment: 'main'
          pact_broker_url: ${{ secrets.PACT_BROKER_URL }}
          pact_broker_username: ${{ secrets.PACT_BROKER_USERNAME }}
          pact_broker_password: ${{ secrets.PACT_BROKER_PASSWORD }}

  deploy-shared-mock-oauth2:
    runs-on: ubuntu-latest
    needs: [ release, ecr-publish-service-image ]
    environment: uat
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run deploy prerequisites
        id: deploy_prerequisites
        uses: ./.github/actions/deploy_prerequisites
        with:
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          ecr-role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          ecr-region: ${{ vars.ECR_REGION }}
      - name: Deploy shared mock-oauth2 server
        shell: bash
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 Deploying SHARED mock-oauth2 server"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "   This shared instance will be used by ALL PR deployments"
          echo "   Namespace: ${KUBE_NAMESPACE}"
          echo "   Release:   laa-data-access-mock-oauth2-shared"
          echo ""
          
          helm upgrade laa-data-access-mock-oauth2-shared .helm/shared-mock-oauth2 \
            --namespace "${KUBE_NAMESPACE}" \
            --install \
            --wait
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Shared mock-oauth2 server deployed successfully!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📋 Service Details:"
          echo "   Service Name: laa-data-access-mock-oauth2-shared"
          echo "   Internal URL: http://laa-data-access-mock-oauth2-shared.${KUBE_NAMESPACE}.svc.cluster.local:9999"
          echo ""
          echo "🔍 Verify deployment:"
          echo "   kubectl get pods -n ${KUBE_NAMESPACE} -l app.kubernetes.io/name=shared-mock-oauth2"
          echo ""
          echo "📝 All PR deployments will now use this shared instance"
          echo "   (No per-PR mock-oauth2 pods will be created)"
          echo ""

  prepare-feature-environments:
    name: Approve and prepare feature environments
    runs-on: ubuntu-latest
    environment: uat-preview
    needs: [ deploy-uat ]
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve preset matrix
        id: resolve
        shell: bash
        env:
          PRESET_FILE: .github/config/ephemeral-environment-presets.json
        run: |
          set -euo pipefail

          [ -f "$PRESET_FILE" ] || { echo "Missing preset file: $PRESET_FILE"; exit 1; }

          sanitize_release_name() {
            local raw cleaned hash_suffix prefix
            raw="$1"
            cleaned=$(echo "$raw" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-' | sed 's/^-*//; s/-*$//; s/--*/-/g')
            if [ -z "$cleaned" ]; then cleaned="feat-env"; fi
            if [ ${#cleaned} -gt 48 ]; then
              hash_suffix=$(printf "%s" "$cleaned" | shasum | cut -c1-8)
              prefix=$(printf "%s" "$cleaned" | cut -c1-39 | sed 's/-*$//')
              cleaned="${prefix}-${hash_suffix}"
            fi
            echo "$cleaned"
          }

          matrix='[]'
          while IFS= read -r preset; do
            suffix=$(jq -r --arg p "$preset" '.[$p].suffix // $p' "$PRESET_FILE")
            preset_extra_env=$(jq -r --arg p "$preset" '.[$p].extraEnv // ""' "$PRESET_FILE")
            release_name=$(sanitize_release_name "$suffix")
            matrix=$(jq -c \
              --arg preset_name "$preset" \
              --arg release_name "$release_name" \
              --arg extra_env "$preset_extra_env" \
              '. + [{preset_name:$preset_name, release_name:$release_name, extra_env:$extra_env}]' \
              <<< "$matrix")
          done < <(jq -r 'keys[]' "$PRESET_FILE" | sort)

          [ "$matrix" != "[]" ] || { echo "No presets resolved from file: ${PRESET_FILE}"; exit 1; }
          echo "matrix={\"include\":${matrix}}" >> "$GITHUB_OUTPUT"

  deploy-matrix-rc-feature:
    runs-on: ubuntu-latest
    needs: [ release, prepare-feature-environments, ecr-publish-service-image ]
    environment: uat
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-feature-environments.outputs.matrix) }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy RC feature environment
        uses: ./.github/actions/deploy_feature_branch
        with:
          ecr-region: ${{ vars.ECR_REGION }}
          ecr-role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          ecr-repository: ${{ vars.ECR_REPOSITORY }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          app-environment: rc-feature
          release-name-override: ${{ matrix.release_name }}
          extra-env: ${{ matrix.extra_env }}
          image-tag: ${{ needs.ecr-publish-service-image.outputs.published_image_version }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [ deploy-uat, release, ecr-publish-service-image ]
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy staging
        uses: ./.github/actions/deploy
        with:
          ecr-region: ${{ vars.ECR_REGION }}
          ecr-role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          ecr-repository: ${{ vars.ECR_REPOSITORY }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          app-environment: staging
          image-tag: ${{ needs.ecr-publish-service-image.outputs.published_image_version }}


  deploy-production:
    runs-on: ubuntu-latest
    needs: [ deploy-staging, release, ecr-publish-service-image ]
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy production
        uses: ./.github/actions/deploy
        with:
          ecr-region: ${{ vars.ECR_REGION }}
          ecr-role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          ecr-repository: ${{ vars.ECR_REPOSITORY }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          app-environment: production
          image-tag: ${{ needs.ecr-publish-service-image.outputs.published_image_version }}
