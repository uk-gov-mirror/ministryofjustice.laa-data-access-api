import org.gradle.api.tasks.testing.logging.TestLogEvent

plugins {
    id 'java'
    id 'jacoco'
    id 'io.freefair.lombok' version '9.5.0'
    id "com.gorylenko.gradle-git-properties" version "2.5.7"
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin'
    id 'com.avast.gradle.docker-compose' version '0.17.21'
    id 'io.sentry.jvm.gradle' version '5.12.2'
    id 'au.com.dius.pact' version '4.7.5'
}

def versions = [
        sentry : '8.52.0'
]

sourceSets {
    testUtilities {
        java {
            srcDir 'src/testUtilities/java'
        }
        resources {
            srcDir 'src/testUtilities/resources'
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.testUtilities.output
        runtimeClasspath += sourceSets.testUtilities.output
    }
    integrationTest {
        compileClasspath += sourceSets.testUtilities.output
        runtimeClasspath += sourceSets.testUtilities.output
    }
    pactTest {
        java {
            compileClasspath += main.output + test.output
            runtimeClasspath += main.output + test.output
        }
    }
}

configurations {
    testUtilitiesImplementation.extendsFrom testImplementation
    testUtilitiesRuntimeOnly.extendsFrom testRuntimeOnly
    pactTestImplementation.extendsFrom testImplementation
    pactTestRuntimeOnly.extendsFrom testRuntimeOnly

    testUtilitiesRuntimeElements {
        canBeConsumed = true
        canBeResolved = false
        extendsFrom testUtilitiesImplementation, testUtilitiesRuntimeOnly
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        }
    }
}

tasks.register('testUtilitiesJar', Jar) {
    archiveClassifier = 'test-utilities'
    from sourceSets.testUtilities.output
}

artifacts {
    testUtilitiesRuntimeElements(tasks.named('testUtilitiesJar'))
}

dockerCompose {
    useComposeFiles = ['../docker-compose.yml']
    // workaround https://github.com/avast/gradle-docker-compose-plugin/issues/435
    def dockerPath = ["/usr/bin/docker", "/usr/local/bin/docker"].find {
        new File(it).exists()
    }
    if (dockerPath) {
        dockerExecutable.set(dockerPath)
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

tasks.named('integrationTest') {
    useJUnitPlatform()
    jacoco {
        destinationFile = layout.buildDirectory.file("jacoco/integrationTest.exec").get().asFile
    }

    testLogging {
        events TestLogEvent.PASSED, TestLogEvent.SKIPPED, TestLogEvent.FAILED
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
}

tasks.register('infrastructureTest', Test) {
    description = 'Runs @SmokeTest-annotated tests against a live deployed environment'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath

    // Unconditionally use infrastructure mode — no flag needed
    systemProperty 'test.mode', 'infrastructure'

    filter {
        includeTestsMatching 'uk.gov.justice.laa.dstew.access.controller.*'
    }
    useJUnitPlatform {
        includeTags 'smoke'
    }

    ['LAA_SMOKE_ACCESS_API_URL',
     'LAA_SMOKE_ACCESS_DB_URL',
     'LAA_SMOKE_ACCESS_DB_USERNAME',
     'LAA_SMOKE_ACCESS_DB_PASSWORD',
     'FEATURE_DISABLE_SECURITY',
     'FEATURE_ENABLE_DEV_TOKENS'].each { key ->
        def value = System.getenv(key)
        if (value) environment key, value
    }

    testLogging {
        events TestLogEvent.PASSED, TestLogEvent.SKIPPED, TestLogEvent.FAILED
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = true
        showStandardStreams = true
    }
}

jacoco {
    toolVersion = "0.8.15"
}

//so that we load properties from gradle properties
task copyFileFromRootProject(type: Copy) {
    from "${rootProject.projectDir}/gradle.properties"
    into 'build/resources/main'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/AccessApp.class', '**/generated/**', '**/*Generated*.*', '**/export/generated/**', '**/*_.class'])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn integrationTest

    executionData(
        layout.buildDirectory.file("jacoco/test.exec"),
        layout.buildDirectory.file("jacoco/integrationTest.exec")
    )

    afterEvaluate {
        classDirectories.setFrom(files(sourceSets.main.output.classesDirs.collect {
            fileTree(dir: it, exclude: ['**/AccessApp.class', '**/generated/**', '**/*Generated*.*', '**/export/generated/**', '**/*_.class'])
        }))
    }

    violationRules {
        failOnViolation = true

        rule {
            element = 'CLASS'
            limit {
                counter = 'LINE'
                minimum = 0.9
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.9
            }
        }
    }
}

spotlessApply.mustRunAfter clean
build.mustRunAfter spotlessApply
tasks.named('integrationTest').configure { mustRunAfter build }
jacocoTestCoverageVerification.mustRunAfter tasks.named('integrationTest')

tasks.register('preflightCheck') {
    description = 'Runs clean, spotlessApply, build, integrationTest and jacocoTestCoverageVerification'
    group = 'verification'
    dependsOn clean, spotlessApply, build, tasks.named('integrationTest'), jacocoTestCoverageVerification, combinedCoverageReport
}

tasks.register('combinedCoverageReport', JacocoReport) {
    description = 'Generates a combined JaCoCo coverage report for unit tests and integration tests'
    group = 'verification'
    dependsOn test, tasks.named('integrationTest')

    executionData(
        layout.buildDirectory.file('jacoco/test.exec'),
        layout.buildDirectory.file('jacoco/integrationTest.exec')
    )

    sourceDirectories.from(sourceSets.main.allJava.srcDirs)
    classDirectories.from(files(sourceSets.main.output.classesDirs).asFileTree.matching {
        exclude '**/AccessApp.class', '**/generated/**', '**/*Generated*.*', '**/export/generated/**', '**/*_.class'
    })

    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/combined/combined.xml')
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/combined/html')
        csv.required = false
    }

    doLast {
        logger.lifecycle("Combined coverage report written to: ${reports.html.outputLocation.get().asFile.toURI()}")
    }
}

dependencyManagement {
    dependencies {
        dependencySet(group: 'io.sentry', version: versions.sentry) {
            entry 'sentry-spring-boot-starter'
            entry 'sentry-logback'
        }
    }
}

// Workaround: Disable gradle-git-properties due to compatibility issues with Java 21+ and newer Gradle
tasks.named('generateGitProperties') {
    enabled = false
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}


dependencies {
    implementation project(':data-access-api')
    implementation project(':data-access-shared')

    // Remove explicit Spring Security and Spring Core versions - let Spring Boot 4 manage them
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation('org.springframework.boot:spring-boot-starter-security') {
        exclude group: 'org.springframework.security', module: 'spring-security-config'
        exclude group: 'org.springframework.security', module: 'spring-security-web'
    }
    implementation('org.springframework.boot:spring-boot-starter-oauth2-resource-server') {
        exclude group: 'org.springframework.security', module: 'spring-security-web'
    }
    implementation 'org.springframework.security:spring-security-config'
    implementation 'org.springframework.security:spring-security-web'
    implementation 'org.springframework.data:spring-data-commons'
    implementation 'org.springframework:spring-core'
    implementation 'org.springframework:spring-expression'
    implementation 'org.springframework:spring-web'
    implementation 'org.springframework:spring-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation('org.springframework.boot:spring-boot-starter-web') {
        exclude group: 'com.google.code.gson', module: 'gson'
    }
    implementation('org.springframework.boot:spring-boot-starter-webmvc') {
        exclude group: 'com.google.code.gson', module: 'gson'
    }

    implementation('org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0') {
        exclude group: 'tools.jackson.core'
    }
    implementation("org.springframework.boot:spring-boot-starter-flyway")
    implementation("org.flywaydb:flyway-database-postgresql")

    // Source: https://mvnrepository.com/artifact/com.azure.spring/spring-cloud-azure-starter-active-directory
    // Note: Version 7.0.0 may not be compatible with Spring Boot 4, check for updated version
    implementation 'com.azure.spring:spring-cloud-azure-starter-active-directory:7.4.0'

    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'net.ttddyy.observation:datasource-micrometer-spring-boot:2.2.1'
    implementation 'com.fasterxml.uuid:java-uuid-generator:5.2.0'

    implementation 'com.networknt:json-schema-validator:3.0.6'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.hibernate.orm:hibernate-processor:7.4.5.Final'
    implementation 'org.javers:javers-core:7.11.7'

    //[https://security.snyk.io/vuln/SNYK-JAVA-ORGPOSTGRESQL-17874248] in org.postgresql:postgresql@42.7.11 introduced by org.postgresql:postgresql@42.7.11
    runtimeOnly 'org.postgresql:postgresql:42.7.13'
    runtimeOnly "org.flywaydb:flyway-database-postgresql"

    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.instancio:instancio-junit:5.6.0'
    testImplementation 'net.datafaker:datafaker:2.7.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "org.testcontainers:testcontainers-junit-jupiter:2.0.5"
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide#test-code
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'

    // Mock OAuth2 server and WireMock for integration tests
    integrationTestImplementation 'no.nav.security:mock-oauth2-server:2.3.0'
    integrationTestImplementation 'org.wiremock:wiremock-standalone:3.13.2'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Sentry
    implementation platform("io.sentry:sentry-bom:$versions.sentry")
    implementation "io.sentry:sentry-logback:$versions.sentry"
    implementation "io.sentry:sentry-spring-boot-4:$versions.sentry"

    // Structured Logging - ECS format
    implementation 'co.elastic.logging:logback-ecs-encoder:1.8.0'
    implementation 'ch.qos.logback:logback-classic'
    implementation 'ch.qos.logback:logback-core'

    // Pact provider verification — runs in the dedicated `pactTest` source set
    pactTestImplementation 'au.com.dius.pact.provider:spring7:4.7.5'
    pactTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    pactTestImplementation 'org.apache.httpcomponents:httpclient:4.5.14'
}

tasks.register('pactTest', Test) {
    description = 'Runs Pact provider verification tests against contracts pulled from the broker.'
    group = 'verification'
    useJUnitPlatform()

    testClassesDirs = sourceSets.pactTest.output.classesDirs
    classpath = sourceSets.pactTest.runtimeClasspath

    // Publish verification results back to the broker only when broker creds are present.
    def canPublish =
            providers.environmentVariable('PACT_BROKER_USERNAME').isPresent() &&
            providers.environmentVariable('PACT_BROKER_PASSWORD').isPresent()
    if (canPublish) {
        systemProperty 'pact.verifier.publishResults', 'true'
    }

    // Broker connection — env-driven, with sensible defaults so it still parses locally.
    systemProperty 'pact.provider.version',     providers.environmentVariable('GIT_SHA').getOrElse('1.0.0')

    // Record the provider branch with published verification results — the broker's
    // auto-trigger and can-i-deploy resolve pacts against the provider's main branch,
    // so verifications must carry branch data (see LFA mainBranch incident).
    def providerBranch = providers.environmentVariable('PACT_PROVIDER_BRANCH').orNull
    if (providerBranch) {
        systemProperty 'pact.provider.branch', providerBranch
    }
    systemProperty 'pactbroker.url',            providers.environmentVariable('PACT_BROKER_URL').getOrElse('https://laa-data-pact-broker.apps.live.cloud-platform.service.justice.gov.uk/')
    systemProperty 'pactbroker.auth.username',  providers.environmentVariable('PACT_BROKER_USERNAME').getOrElse('ABC')
    systemProperty 'pactbroker.auth.password',  providers.environmentVariable('PACT_BROKER_PASSWORD').getOrElse('ABC')

    // Consumer-version selectors: filter by name + branch when the webhook supplies them.
    def consumerName = providers.environmentVariable('PACT_CONSUMER_NAME').orNull
    if (consumerName) {
        systemProperty 'pact.filter.consumers', consumerName
    }
    def branch = providers.environmentVariable('PACT_CONSUMER_BRANCH').getOrElse('main')
    systemProperty 'pactbroker.consumerversionselectors.rawjson', "[{\"branch\":\"${branch}\"}]"

    systemProperty 'pact.rootDir', layout.buildDirectory.dir("pacts").get().asFile.path
}