paths:
  /api/v0/applications:
    get:
      tags:
        - application-query
      summary: Get applications
      operationId: getApplications
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - in: query
          name: status
          description: The current overall status of the applications' decision.
          schema:
            $ref: "../open-api-common/components.yml#/components/schemas/ApplicationStatus"
        - in: query
          name: laaReference
          description: The LAA reference number of the application
          schema:
            type: string
        - in: query
          name: clientFirstName
          description: The client first name
          schema:
            type: string
        - in: query
          name: clientLastName
          description: The client last name
          schema:
            type: string
        - in: query
          name: clientDateOfBirth
          description: The linked individuals date of dateOfBirth
          schema:
            type: string
            format: date
        - in: query
          name: userId
          description: The caseworkers id
          schema:
            type: string
            format: uuid
        - in: query
          name: autoGranted
          description: Filter by the explicit automatic-assessment state
          schema:
            $ref: "./components.yml#/components/schemas/AutoGranted"
        - in: query
          name: matterTypeCode
          description: Filter by the matter type code of the lead proceeding
          schema:
            type: string
        - in: query
          name: sortBy
          description: The field name to sort by if sorting required (defaults to SUBMITTED_DATE)
          schema:
            $ref: "./components.yml#/components/schemas/ApplicationSortBy"
        - in: query
          name: orderBy
          description: The order to sort by if sorting required (defaults to ASC)
          schema:
            $ref: "./components.yml#/components/schemas/ApplicationOrderBy"
        - in: query
          name: page
          description: Page number of data to be returned (defaults to 1)
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          description: Number of applications in a page (defaults to 20)
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 'Success'
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/ApplicationSummaryResponse"
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
        '500': { description: Internal server error }
    post:
      tags:
        - application-command
      summary: Create an application
      operationId: createApplication
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - $ref: "../open-api-common/components.yml#/components/parameters/XSchemaVersion"
      requestBody:
        description: Create an application (all fields inside `applicationContent`)
        required: true
        content:
          application/json:
            schema:
              $ref: "./components.yml#/components/schemas/ApplicationCreateRequest"
      responses:
        '201':
          description: Created and projection readable
          headers:
            Location:
              schema:
                type: string
        '202':
          description: Created but projection not yet readable; poll the Location header
          headers:
            Location:
              schema:
                type: string
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '409': { description: An application with this id already exists with different content }
        '500': { description: Internal server error }

  /api/v0/applications/{id}:
    get:
      tags:
        - application-query
      summary: Get an application by id
      operationId: getApplicationById
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/ApplicationResponse"
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
        '500': { description: Internal server error }
    patch:
      tags:
        - application-command
      summary: Update an application
      operationId: updateApplication
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Partial update of application (all fields inside `applicationContent`)
        required: true
        content:
          application/json:
            schema:
              $ref: "./components.yml#/components/schemas/ApplicationUpdateRequest"
      responses:
        '200': { description: Success }
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
        '409': { description: Conflict }
        '500': { description: Internal server error }

  /api/v0/applications/{id}/link:
    post:
      tags:
        - application-command
      operationId: linkApplication
      summary: Link an Application to an existing Application's family group
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: id
          in: path
          required: true
          description: Source Application to link
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components.yml#/components/schemas/ApplicationLinkRequest"
            examples:
              firstTimeLink:
                summary: Target is standalone (first-time link)
                description: Omit linkedGroupVersion entirely; the target is not yet in a group.
                value:
                  applicationId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  linkType: FAMILY
              targetAlreadyLinked:
                summary: Target already belongs to a group
                description: Supply the target's linkedGroupVersion token exactly as last read.
                value:
                  applicationId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  linkType: FAMILY
                  linkedGroupVersion: djE6bGlua2VkLWdyb3VwOjdjOWU2Njc5LTc0MjUtNDBkZS05NDRiLWUwN2ZjMWY5MGFlNzoy
      responses:
        "204": { description: "Application linked, or already linked to the target group" }
        "400": { description: "Invalid request, self-link, unsupported link type, or linkedGroupVersion is not a valid token" }
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
        "404": { description: Source or target Application not found }
        "409": { description: "Source Application belongs to a different linked group, the target's linked group has changed since the supplied version, or the target is no longer in the linked group identified by linkedGroupVersion" }
        "500": { description: Internal server error }

  /api/v0/applications/{id}/unlink:
    post:
      tags:
        - application-command
      operationId: unlinkApplication
      summary: Remove an Application from its linked group
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: id
          in: path
          required: true
          description: Application to remove
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components.yml#/components/schemas/LinkedGroupChangeRequest"
      responses:
        "204": { description: Application removed; the group is dissolved if only one member would remain }
        "400": { description: Invalid request (e.g. missing or invalid linkedGroupVersion) }
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
        "404": { description: Application not found }
        "409": { description: "Application is not in a linked group, is the group lead, the linked group has changed since the supplied version, or the application is no longer in the linked group identified by linkedGroupVersion" }
        "500": { description: Internal server error }

  /api/v0/applications/{id}/make-lead:
    post:
      tags:
        - application-command
      operationId: makeApplicationLead
      summary: Make an Application the lead of its linked group
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: id
          in: path
          required: true
          description: Application to make lead
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components.yml#/components/schemas/LinkedGroupChangeRequest"
      responses:
        "204": { description: Application is now the lead (or already was) }
        "400": { description: Invalid request (e.g. missing or invalid linkedGroupVersion) }
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
        "404": { description: Application not found }
        "409": { description: "Application is not in a linked group, the linked group has changed since the supplied version, or the application is no longer in the linked group identified by linkedGroupVersion" }
        "500": { description: Internal server error }

  /api/v0/applications/{id}/history-search:
    get:
      tags:
        - application-query
      summary: Get a list of events associated with an application
      operationId: getApplicationHistory
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - in: path
          name: id
          description: "the ID of the application to get history format"
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: eventType
          required: false
          schema:
            type: array
            items:
              $ref: "../open-api-common/components.yml#/components/schemas/DomainEventType"
      responses:
        '200':
          description: 'Success'
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/ApplicationHistoryResponse"
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
        '500': { description: Internal server error }


  /api/v0/applications/{id}/notes:
    get:
      tags:
        - application-query
      operationId: getApplicationNotes
      summary: Get notes for an application in ascending date order
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: './components.yml#/components/schemas/ApplicationNotesResponse'
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
        '500': { description: Internal server error }
    post:
      tags:
        - application-command
      operationId: createApplicationNotes
      summary: Create notes for an application
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: notes to add to application
        content:
          application/json:
            schema:
              $ref: './components.yml#/components/schemas/CreateNoteRequest'
      responses:
        '200': { description: OK }
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
        '500': { description: Internal server error }

  /api/v0/applications/{id}/decision:
    patch:
      tags:
        - application-command
      operationId: makeDecision
      summary: Make a decision request for an application
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: event history describing the create decision action
        content:
          application/json:
            schema:
              $ref: './components.yml#/components/schemas/MakeDecisionRequest'
      responses:
        '200': { description: OK }
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
        '409': { description: Stale application version or assignment ownership conflict }
        '500': { description: Internal server error }

  /api/v0/applications/{id}/auto-grant-outcome:
    patch:
      tags:
        - application-auto-grant-outcome-command
      operationId: recordAutoGrantOutcome
      summary: Record the outcome of deciding whether an Application can be auto-granted
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yml#/components/schemas/AutoGrantOutcomeRequest'
      responses:
        '200': { description: An equivalent terminal outcome was already recorded }
        '204': { description: Auto-grant outcome recorded }
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Application not found }
        '409': { description: Stale version or incompatible terminal outcome }
        '422': { description: Application is not submitted }
        '500': { description: Internal server error }

  /api/v0/application-drafts:
    post:
      tags:
        - application-drafts
      summary: Start or save an Application draft
      operationId: saveApplicationDraft
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - $ref: "../open-api-common/components.yml#/components/parameters/XSchemaVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components.yml#/components/schemas/CreateApplicationDraftRequest"
      responses:
        '201':
          description: Application draft created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/SaveApplicationDraftResponse"
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '500': { description: Internal server error }

  /api/v0/application-drafts/{applicationId}/submit:
    post:
      tags:
        - application-drafts
      summary: Submit an in-progress Application draft, sealing its content
      description: |
        This command endpoint does not accept a request body. The draft's content, already
        validated in full when it was created, is promoted directly to the immutable
        Application record.
      operationId: submitApplicationDraft
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Application draft submitted and projection readable
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/SubmitApplicationDraftResponse"
        '202':
          description: Application draft submitted but projection not yet readable
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/SubmitApplicationDraftResponse"
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Application draft not found }
        '500': { description: Internal server error }

  /api/v0/applications/{id}/certificate:
    get:
      tags:
        - application-query
      operationId: getCertificate
      summary: Get the certificate information for an application (if it exists)
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Success'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Certificate information
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
        '500': { description: Internal server error }

  /api/v0/applications/{id}/documents:
    post:
      tags:
        - application-document-command
      summary: Upload a supporting document to an Application
      operationId: uploadApplicationDocument
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - documentType
              properties:
                file:
                  type: string
                  format: binary
                documentType:
                  $ref: "../open-api-common/components.yml#/components/schemas/DocumentType"
      responses:
        '201':
          description: Document uploaded and recorded against the Application
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/UploadApplicationDocumentResponse"
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Application not found }
        '500': { description: Internal server error }

  /api/v0/applications/{applicationId}/documents/{documentId}:
    get:
      tags:
        - application-document-query
      summary: Download a supporting evidence document for an Application
      operationId: downloadApplicationDocument
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document content
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename
            X-Document-Uploaded-At:
              schema:
                type: string
                format: date-time
              description: Timestamp when the document was uploaded
            X-Document-Type:
              schema:
                type: string
              description: Supporting document type assigned to the document
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Application or document not found }
        '500': { description: Internal server error }

  /api/v0/sds/health:
    get:
      tags:
        - sds-query
      summary: Check SDS Api health
      operationId: getSdsHealth
      responses:
        '200':
          description: 'Success'
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/SdsHealthResponse"
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '503': { description: Internal server error }
