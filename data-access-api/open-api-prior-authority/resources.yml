paths:
  /api/v0/prior-authorities/{priorAuthorityId}:
    get:
      tags:
        - prior-authorities
      summary: Retrieve a Prior Authority request by priorAuthorityId, whether it is still an in-progress draft or has already been submitted
      operationId: getPriorAuthority
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: priorAuthorityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Prior Authority found
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/PriorAuthorityResponse"
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Prior Authority not found }
        '500': { description: Internal server error }
    put:
      tags:
        - prior-authority-draft-command
      summary: Update an existing Prior Authority draft
      operationId: updatePriorAuthorityDraft
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: priorAuthorityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components.yml#/components/schemas/SavePriorAuthorityDraftRequest"
      responses:
        '204':
          description: Prior Authority draft updated
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Prior Authority not found }
        '500': { description: Internal server error }

  /api/v0/prior-authorities/{priorAuthorityId}/submit:
    post:
      tags:
        - prior-authority-draft-command
      summary: Submit an in-progress Prior Authority draft, sealing its content
      operationId: submitPriorAuthorityDraft
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: priorAuthorityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Prior Authority draft submitted and projection readable
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/SubmitPriorAuthorityDraftResponse"
        '202':
          description: Prior Authority draft submitted but projection not yet readable
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/SubmitPriorAuthorityDraftResponse"
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Prior Authority not found }
        '409': { description: Prior Authority is not in a submittable state }

  /api/v0/prior-authorities/{priorAuthorityId}/documents:
    post:
      tags:
        - prior-authority-draft-command
      summary: Attach a supporting evidence document to an in-progress Prior Authority draft
      operationId: attachPriorAuthorityDocument
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: priorAuthorityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document attached
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/AttachPriorAuthorityDocumentResponse"
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Prior Authority not found }
        '409': { description: Prior Authority is not in progress }
        '500': { description: Internal server error }

  /api/v0/applications/{applicationId}/prior-authority/draft:
    post:
      tags:
        - prior-authority-draft-command
      summary: Start or save a Prior Authority draft
      operationId: savePriorAuthorityDraft
      parameters:
        - $ref: "../open-api-common/components.yml#/components/parameters/XServiceName"
        - name: applicationId
          in: path
          description: The application's ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components.yml#/components/schemas/SavePriorAuthorityDraftRequest"
      responses:
        '201':
          description: Prior Authority draft created and projection readable
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/SavePriorAuthorityDraftResponse"
        '202':
          description: Prior Authority draft submitted but projection not yet readable
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./components.yml#/components/schemas/SavePriorAuthorityDraftResponse"
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Application not found }

